<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="chev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2,1 L8,5 L2,9" fill="none" stroke="#9aa3b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="chevAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2,1 L8,5 L2,9" fill="none" stroke="#6e7cf2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1f2328" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="290" fill="#ffffff"/>

  <!-- step cards -->
  <g filter="url(#shadow)">
    <rect x="12" y="40" width="200" height="150" rx="16" fill="#ffffff" stroke="#e4e7ee"/>
    <rect x="256" y="40" width="200" height="150" rx="16" fill="#ffffff" stroke="#e4e7ee"/>
    <rect x="500" y="40" width="200" height="150" rx="16" fill="#f5f6ff" stroke="#6e7cf2" stroke-width="1.5"/>
    <rect x="744" y="40" width="200" height="150" rx="16" fill="#ffffff" stroke="#e4e7ee"/>
    <rect x="988" y="40" width="200" height="150" rx="16" fill="#ffffff" stroke="#e4e7ee"/>
  </g>

  <!-- step numbers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="44" cy="74" r="14" fill="#eef0fe"/><text x="44" y="79" fill="#6e7cf2">1</text>
    <circle cx="288" cy="74" r="14" fill="#eef0fe"/><text x="288" y="79" fill="#6e7cf2">2</text>
    <circle cx="532" cy="74" r="14" fill="#6e7cf2"/><text x="532" y="79" fill="#ffffff">3</text>
    <circle cx="776" cy="74" r="14" fill="#eef0fe"/><text x="776" y="79" fill="#6e7cf2">4</text>
    <circle cx="1020" cy="74" r="14" fill="#eef0fe"/><text x="1020" y="79" fill="#6e7cf2">5</text>
  </g>

  <!-- titles -->
  <g font-size="19" font-weight="700" fill="#1f2328">
    <text x="32" y="122">결제할 곳 입력</text>
    <text x="276" y="122">카드별 혜택 계산</text>
    <text x="520" y="122">유리한 카드 추천</text>
    <text x="764" y="122">결제 확인</text>
    <text x="1008" y="122">챙긴 혜택 확인</text>
  </g>

  <!-- descriptions -->
  <g font-size="14.5" fill="#6b7280">
    <text x="32" y="150">결제처나 업종을 고르고</text>
    <text x="32" y="172">금액을 입력해요</text>
    <text x="276" y="150">혜택 조건, 지난달 실적,</text>
    <text x="276" y="172">남은 한도까지 반영해요</text>
    <text x="764" y="150">실제로 쓴 카드를 기록하고</text>
    <text x="764" y="172">한도를 차감해요</text>
    <text x="1008" y="150">월별 결제 기록과</text>
    <text x="1008" y="172">카드별 챙긴 혜택을 봐요</text>
  </g>

  <!-- result pills in step 3 -->
  <rect x="520" y="140" width="56" height="26" rx="13" fill="#6e7cf2"/>
  <text x="548" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">확정</text>
  <rect x="584" y="140" width="68" height="26" rx="13" fill="#ffffff" stroke="#6e7cf2"/>
  <text x="618" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="#6e7cf2">조건부</text>

  <!-- connectors -->
  <g stroke="#9aa3b5" stroke-width="1.8" fill="none">
    <line x1="220" y1="115" x2="246" y2="115" marker-end="url(#chev)"/>
    <line x1="464" y1="115" x2="490" y2="115" marker-end="url(#chev)"/>
    <line x1="708" y1="115" x2="734" y2="115" marker-end="url(#chev)"/>
    <line x1="952" y1="115" x2="978" y2="115" marker-end="url(#chev)"/>
  </g>

  <!-- recalculation loop -->
  <path d="M618,198 C618,262 356,262 356,202" fill="none" stroke="#6e7cf2" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#chevAccent)"/>
  <rect x="397" y="234" width="182" height="30" rx="15" fill="#ffffff" stroke="#dfe3fb"/>
  <text x="488" y="254" font-size="14" text-anchor="middle" fill="#6e7cf2">실적·한도를 알려주면 다시 계산</text>

</svg>
