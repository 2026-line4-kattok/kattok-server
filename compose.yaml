name: kattok

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kattok
      POSTGRES_USER: kattok
      POSTGRES_PASSWORD: kattok
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kattok -d kattok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
