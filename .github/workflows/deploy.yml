name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# 연달아 머지하면 배포가 동시에 돌아 같은 컨테이너를 지우고 만들다 충돌한다.
# 한 번에 하나씩만 돌리고, 진행 중인 배포는 끝까지 마친 뒤 다음 배포를 한다(대기 중인 배포는 가장 최근 것만 남는다).
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: kattok-server
  EC2_HOST: 54.116.209.105

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,JWT_SECRET,DEMO_USER_PASSWORD
          script: |
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}
            docker pull ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            docker stop kattok-server || true
            docker rm kattok-server || true
            docker run -d --name kattok-server --network kattok-net -p 8080:8080 --restart unless-stopped \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://kattok-postgres:5432/kattok \
              -e SPRING_DATASOURCE_USERNAME=kattok \
              -e SPRING_DATASOURCE_PASSWORD=$DB_PASSWORD \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JWT_SECRET=$JWT_SECRET \
              -e DEMO_USER_PASSWORD=$DEMO_USER_PASSWORD \
              -e KATTOK_DEMO_SEED=true \
              ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            # docker run은 컨테이너만 띄우고 바로 끝나서, 서버가 시작하다 실패해도 배포가 성공으로 보인다.
            # 서버가 정상 응답할 때까지 최대 3분 기다리고, 끝내 응답이 없으면 로그를 남기고 실패시킨다.
            for i in $(seq 1 36); do
              if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "서버 정상 응답 (약 $((i * 5))초)"
                exit 0
              fi
              sleep 5
            done
            echo "서버가 3분 안에 정상 응답하지 않았습니다. 최근 로그:"
            docker logs --tail 100 kattok-server
            exit 1
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
